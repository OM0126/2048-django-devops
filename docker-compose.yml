services:
  web:
    image: om0126/2048-django-devops:latest
    container_name: "2048-django-app"
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles

  nginx:
    image: nginx:alpine
    container_name: "2048-nginx"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/staticfiles:ro
    depends_on:
      - web

volumes:
  static_volume:
