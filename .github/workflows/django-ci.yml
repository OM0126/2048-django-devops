name: Django CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        run: |
          python manage.py test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t om0126/2048-django-devops:latest \
            -t om0126/2048-django-devops:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push om0126/2048-django-devops:latest
          docker push om0126/2048-django-devops:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::583664563026:role/GitHubActions-EKS-2048
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name 2048-eks

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/2048-deployment \
            game-2048=om0126/2048-django-devops:${{ github.sha }}

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/2048-deployment \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get services
