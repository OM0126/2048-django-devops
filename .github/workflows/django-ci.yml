name: Django CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run Django tests
      - name: Run Django tests
        run: |
          python manage.py test

      # 5. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t om0126/2048-django-devops:latest \
            -t om0126/2048-django-devops:${{ github.sha }} .

      # 7. Push Docker image to Docker Hub
      - name: Push Docker images
        run: |
          docker push om0126/2048-django-devops:latest
          docker push om0126/2048-django-devops:${{ github.sha }}

      # 8. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/2048-django-devops
            cd ~/2048-django-devops

            curl -fsSL https://raw.githubusercontent.com/OM0126/2048-django-devops/${{ github.sha }}/docker-compose.yml -o docker-compose.yml

            curl -fsSL https://raw.githubusercontent.com/OM0126/2048-django-devops/${{ github.sha }}/nginx/nginx.conf -o nginx.conf

            mkdir -p nginx
            mv nginx.conf nginx/nginx.conf

            sed -i "s|image: om0126/2048-django-devops:latest|image: om0126/2048-django-devops:${{ github.sha }}|" docker-compose.yml

            docker stop 2048-app || true
            docker rm 2048-app || true

            docker-compose down || true
            docker-compose pull
            docker-compose up -d
